[tool.poetry]
name = "clinical-oversight-study"
version = "0.1.0"
description = "Do structure, guidance or a stronger model's notes help small AI checkers catch planted errors in medical advice?"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
anthropic = "*"
openai = "*"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
markdown = "^3.11.3"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
