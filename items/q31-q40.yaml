    text: >-
      Refer to hospital people with sore throat and suspected severe complications such as quinsy
      (peritonsillar abscess): worsening one-sided throat pain, a muffled voice, difficulty opening
      the mouth (trismus) and difficulty swallowing. Signs of airway compromise, such as stridor,
      drooling or difficulty breathing, need emergency care.
