  checked: true
  drafted_by: claude-opus-5-5
  source:
    ref: "NICE NG185 Acute coronary syndromes; NICE CG95 Chest pain of recent onset"
    text: >-
      Atypical presentations of acute coronary syndrome, including breathlessness, nausea,
      epigastric discomfort and fatigue, are more common in older people, women and people with
      diabetes. Refer people with a suspected acute coronary syndrome and chest pain in the last 12
